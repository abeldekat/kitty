# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

#: Fonts {{{
font_family      family='JetBrains Mono' style=Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0
disable_ligatures cursor
#: }}}

#: Text cursor customization {{{
cursor_blink_interval 0
cursor_trail 1
#: }}}

#: Scrollback {{{
# maybe set scrollback_lines and scrollback_pager_history_size
scrollbar never
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
#: }}}

#: Terminall bell {{{
enable_audio_bell no
#: }}}

#: Window layout {{{
# not using splits, horizontal and vertical
enabled_layouts fat,tall,grid,stack
window_padding_width 4
hide_window_decorations yes
confirm_os_window_close 0
active_border_color none
#: }}}

#: Tab bar {{{
include tabbar.conf
#: }}}

#: Color scheme {{{
# see first lines of this file
#: }}}

#: Advanced {{{
# maybe set clipboard_max_size
allow_remote_control yes
update_check_interval 0
# use startup session to avoid starting with a non-session tab
startup_session ./sessions/home.kitty-session
shell_integration no-cursor
#: }}}

#: Keyboard shortcuts {{{
include mappings.conf
#: }}}

# vim:fileencoding=utf-8:foldmethod=marker
